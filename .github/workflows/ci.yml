name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Validate generated romaji spacing and reviewed conjunctions
        run: |
          bun run tools:setup
          bun run romaji:check
          bun run romaji:test
          bun run levels:check
          bun run levels:test
          bun run hints:test
          bun run readings:test
          bun run furigana:test
      - run: bun run alternatives:check
      - run: bun run check
      - run: bun run build
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Smoke test container
        run: |
          docker compose exec -T web bun -e '
            for (const path of ["/health", "/"]) {
              const response = await fetch(`http://127.0.0.1:3000${path}`);
              if (!response.ok) {
                throw new Error(`${path}: HTTP ${response.status}`);
              }
            }
          '
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
